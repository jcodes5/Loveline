<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9f7" />
    <title>Loveline — You’re offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #fff9f7; color: #2b2426; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 10% 10%, #f5dce4 0, transparent 34%), #fff9f7; }
      main { width: min(100%, 480px); padding: 48px 32px; border: 1px solid #ede1e3; border-radius: 28px; background: rgba(255,255,255,.88); box-shadow: 0 12px 40px rgba(74, 45, 54, .1); text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 28px; display: grid; place-items: center; border-radius: 50%; background: #c85a78; color: white; font-size: 28px; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(36px, 9vw, 54px); line-height: .96; letter-spacing: -.04em; font-weight: 600; }
      p { max-width: 330px; margin: 20px auto 0; color: #766a6e; font-size: 16px; line-height: 1.7; }
      button { min-height: 44px; margin-top: 28px; padding: 0 22px; border: 0; border-radius: 999px; background: #c85a78; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid rgba(200,90,120,.35); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">♥</div>
      <h1>You’re offline.</h1>
      <p>Your saved Loveline shell is still here. Reconnect to open fresh messages and memories.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
